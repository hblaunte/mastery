<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/><stop offset="0.55" stop-color="#0f1426"/><stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ef0d8" stop-opacity="0.95"/><stop offset="0.45" stop-color="#5fd3c2" stop-opacity="0.35"/><stop offset="1" stop-color="#5fd3c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- links: dim until a node is lit -->
  <g stroke="#9fb0d8" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round">
    <line x1="330" y1="660" x2="512" y2="420"/>
    <line x1="694" y1="660" x2="512" y2="420"/>
    <line x1="330" y1="660" x2="694" y2="660"/>
    <line x1="512" y1="420" x2="512" y2="250"/>
  </g>
  <!-- unlit nodes -->
  <circle cx="330" cy="660" r="46" fill="#1c2340" stroke="#9fb0d8" stroke-opacity="0.55" stroke-width="8"/>
  <circle cx="694" cy="660" r="46" fill="#1c2340" stroke="#9fb0d8" stroke-opacity="0.55" stroke-width="8"/>
  <circle cx="512" cy="250" r="34" fill="#1c2340" stroke="#9fb0d8" stroke-opacity="0.55" stroke-width="8"/>
  <!-- the lit node -->
  <circle cx="512" cy="420" r="210" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="512" cy="420" r="74" fill="#8ef0d8"/>
  <circle cx="512" cy="420" r="74" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="6"/>
</svg>
