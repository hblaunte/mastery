# Build installers and publish them to a GitHub Release whenever a version tag is pushed.
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match apps/desktop/package.json "version" (electron-builder checks this).
# Signing is optional: add the secrets below and the same workflow produces signed, notarized
# builds; without them the installers are unsigned (see docs/packaging.md for what users see).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @mastery/desktop build
      # Secrets that are not set arrive as empty strings, and electron-builder treats an empty
      # CSC_LINK as a certificate path. Export only the credentials that exist.
      - name: Signing credentials
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          add() { if [ -n "$2" ]; then echo "$1=$2" >> "$GITHUB_ENV"; echo "$1: set"; else echo "$1: not set, skipping"; fi; }
          add CSC_LINK "$MAC_CERT_P12"
          add CSC_KEY_PASSWORD "$MAC_CERT_PASSWORD"
          add APPLE_ID "$APPLE_ID"
          add APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
          add APPLE_TEAM_ID "$APPLE_TEAM_ID"
          add WIN_CSC_LINK "$WIN_CERT_PFX"
          add WIN_CSC_KEY_PASSWORD "$WIN_CERT_PASSWORD"
      - name: Package and publish
        run: pnpm --filter @mastery/desktop exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # electron-builder leaves the release as a draft while the two platform jobs upload into it.
  # Once both have finished, publish it so the download page and the updater can see it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
